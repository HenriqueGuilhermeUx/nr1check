name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android-aab.yml"
      - "apps/android/**"
      - "play-store/**"
      - "scripts/generate_play_assets.py"
      - "README_ANDROID_GOOGLE_PLAY.md"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Prepare upload keystore
        working-directory: apps/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 secret"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
            echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "Keystore loaded from GitHub Secrets" > upload-keystore-passwords.txt
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> upload-keystore-passwords.txt
          else
            echo "No production keystore secrets found. Generating temporary upload keystore artifact. Keep it if you publish this first build."
            STORE_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair \
              -v \
              -storetype JKS \
              -keystore upload-keystore.jks \
              -storepass "$STORE_PASS" \
              -alias nr1check-upload \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NR1Check, OU=Alternative Ventures, O=Alternative Ventures Ltda, L=Santos, ST=SP, C=BR"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=nr1check-upload" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASS" > upload-keystore-passwords.txt
            echo "KEY_PASSWORD=$KEY_PASS" >> upload-keystore-passwords.txt
            echo "KEY_ALIAS=nr1check-upload" >> upload-keystore-passwords.txt
          fi

      - name: Verify generated signing key
        working-directory: apps/android
        run: |
          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"

      - name: Build test APK and release AAB
        working-directory: apps/android
        run: |
          gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease \
            -PRELEASE_STORE_FILE=$PWD/upload-keystore.jks \
            -PRELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD \
            -PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS \
            -PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD \
            --no-daemon --stacktrace

      - name: Generate Play Store images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python scripts/generate_play_assets.py

      - name: Collect artifacts
        run: |
          mkdir -p android-release/apk android-release/aab android-release/signing android-release/play-store
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk android-release/apk/NR1Check-teste-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release.apk android-release/apk/NR1Check-release.apk
          cp apps/android/app/build/outputs/bundle/release/app-release.aab android-release/aab/NR1Check-v1.0.0.aab
          cp apps/android/upload-keystore.jks android-release/signing/upload-keystore.jks
          cp apps/android/upload-keystore-passwords.txt android-release/signing/upload-keystore-passwords.txt
          cp -R play-store/generated android-release/play-store/images
          cp -R play-store/listing android-release/play-store/listing
          cp README_ANDROID_GOOGLE_PLAY.md android-release/README_ANDROID_GOOGLE_PLAY.md

      - name: Upload Android APK/AAB package
        uses: actions/upload-artifact@v4
        with:
          name: nr1check-android-apk-aab-google-play
          path: android-release
          retention-days: 14
