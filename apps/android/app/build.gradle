plugins {
    id "com.android.application"
}

def hasReleaseSigning = project.hasProperty("RELEASE_STORE_FILE") &&
    project.hasProperty("RELEASE_STORE_PASSWORD") &&
    project.hasProperty("RELEASE_KEY_ALIAS") &&
    project.hasProperty("RELEASE_KEY_PASSWORD")

android {
    namespace "br.com.nr1check.app"
    compileSdk 36

    defaultConfig {
        applicationId "br.com.nr1check.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "APP_URL", '"https://nr1check.netlify.app/app?source=android"'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(project.property("RELEASE_STORE_FILE"))
                storePassword project.property("RELEASE_STORE_PASSWORD")
                keyAlias project.property("RELEASE_KEY_ALIAS")
                keyPassword project.property("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}
